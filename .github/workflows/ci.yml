name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, and validate containers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore CommerceMicroservices.sln

      - name: Build solution
        run: dotnet build CommerceMicroservices.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CommerceMicroservices.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build production Docker images
        run: docker compose build
